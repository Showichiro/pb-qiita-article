name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: bun run typecheck
      - if: runner.os == 'Linux'
        run: bunx biome lint src/
      - if: runner.os == 'Linux'
        run: bun run test:ci
      - if: runner.os == 'Linux'
        run: bun run deploy:check
      - if: runner.os == 'Windows'
        run: bun run build
      - if: runner.os == 'Windows'
        run: bun run schema:apply
